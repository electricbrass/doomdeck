name: Lint

on: push

permissions:
  contents: read
  packages: read

jobs:
  check-formatting:
    name: Check Formatting
    runs-on: ubuntu-26.04
    container: ghcr.io/${{ github.repository }}-ci:debian
    steps:
      - uses: actions/checkout@v7
      - name: Run clang-format
        run: find src test -name '*.cpp' -print0 | xargs -0 -r clang-format --dry-run --Werror
  check-tidiness:
    name: Run clang-tidy
    runs-on: ubuntu-26.04
    container: ghcr.io/${{ github.repository }}-ci:debian
    steps:
        - uses: actions/checkout@v7
        - name: Configure CMake
          run: cmake --preset ci-clang
        - name: Run clang-tidy
          run: run-clang-tidy -p build -source-filter "$PWD/src/.*\.cpp\$" -header-filter '' -use-color -warnings-as-errors '*'
