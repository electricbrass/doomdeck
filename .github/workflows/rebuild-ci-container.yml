name: Rebuild CI Container

on:
  workflow_dispatch:
  push:
    paths: ['ci/containers/debian.Containerfile']

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push to ghcr.io
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Login to ghcr
        run: |
          docker login ghcr.io \
            --username ${{ github.actor }} \
            --password ${{ github.token }}
      - name: Build image
        run: |
          docker build \
            --file ci/containers/debian.Containerfile \
            --tag ghcr.io/${{ github.repository }}-ci:debian-${{ matrix.arch }} \
            .
      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository }}-ci:debian-${{ matrix.arch }}
  manifest:
    name: Create multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login to ghcr
        run: |
          docker login ghcr.io \
            --username ${{ github.actor }} \
            --password ${{ github.token }}
      - name: Create manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}-ci:debian \
            ghcr.io/${{ github.repository }}-ci:debian-amd64 \
            ghcr.io/${{ github.repository }}-ci:debian-arm64
